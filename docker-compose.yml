version: '3.8'

services:
  rov-topside:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # Mount repository code into the container
      - .:/workspace:cached
      # Mount X11 socket for GUI rendering (OpenCV windows, Rviz, etc.)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
    # Privileged mode grants access to host devices like webcams (/dev/video*) and serial (/dev/tty*)
    privileged: true
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
